[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "m6-control-plane"
version = "1.0.0"
description = "ULPF M6 Control Plane — Centralised configuration, observability, and operational management for the Universal Log Processing Framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ULPF Team" }]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "factory-boy>=3.3.0",
  "types-passlib",
  "types-redis",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "ISC", "TCH", "RUF"]
ignore = [
  "ANN101", "ANN102", "ANN401", "S101",
  "N818", "B008", "A002", "S104", "S106",
  "RUF001", "RUF002", "RUF003", "RUF005",
  "B904", "N806", "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "N802", "TCH", "E501", "E402", "C408", "F841"]
"backend/alembic/*" = ["ANN", "N", "E501", "TCH"]
"backend/app/schemas/*" = ["TCH", "F401"]
"backend/app/services/config_service.py" = ["E501", "S110", "TCH"]
"backend/app/services/replay_service.py" = ["E501", "TCH"]
"backend/app/repositories/*" = ["TCH", "A002"]
"backend/app/api/*" = ["TCH", "E501"]
"backend/app/integrations/*" = ["TCH", "E501", "S110"]
"backend/app/core/*" = ["TCH", "S110", "E501"]
"backend/app/audit/*" = ["TCH"]
"backend/app/registry/*" = ["TCH", "E501"]
"backend/app/models/*" = ["TCH", "E501", "RUF012"]
"backend/app/main.py" = ["TCH", "N806"]
"backend/app/db/*" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=backend/app --cov-report=term-missing --cov-report=xml -q"

[tool.coverage.run]
omit = ["backend/alembic/*", "tests/*"]
