version: "3.8"

services:
  ulpf-m5:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ulpf-m5-service
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - HOST=0.0.0.0
      - POLICY_FILE_PATH=policies/default.yaml
      - OPENSEARCH_MOCK_MODE=true
      - DATA_LAKE_MOCK_MODE=true
      - KAFKA_MOCK_MODE=true
      - HTTP_MOCK_MODE=true
      - M5_ALLOW_ANONYMOUS=true
    volumes:
      - ./data:/app/data
      - ./policies:/app/policies
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: ulpf-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped
    profiles:
      - full-stack

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ulpf-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: unless-stopped
    profiles:
      - full-stack

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: ulpf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped
    profiles:
      - full-stack
